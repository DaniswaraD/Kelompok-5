<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kelompok 5</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --blue: #a9d7f7;
  --blue-deep: #6fb3e6;
  --blue-soft: #eaf6ff;
  --white: #ffffff;
  --ink: #26445f;
  --shadow: rgba(74, 141, 197, 0.35);
}

*{
  box-sizing: border-box;
}

html, body{
  margin: 0;
  padding: 0;
  height: 100%;
  overflow: hidden;
}

body{
  font-family: 'Fredoka', sans-serif;
  font-weight: 600;
  background: radial-gradient(circle at 25% 15%, #ffffff 0%, #f3f9ff 35%, #e0f0fc 65%, #c9e6f9 100%);
  color: var(--ink);
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  width: 100vw;
  height: 100vh;
}

canvas#snow{
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}

.stage{
  position: relative;
  width: min(92vw, 480px);
  height: min(80vh, 620px);
  display: flex;
  align-items: center;
  justify-content: center;
}

.view{
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 28px;
}

.hidden{
  display: none;
}

.btn{
  font-family: 'Fredoka', sans-serif;
  font-weight: 700;
  font-size: 1.4rem;
  letter-spacing: 0.3px;
  color: var(--white);
  background: linear-gradient(160deg, var(--blue-deep), var(--blue));
  border: 3px solid var(--white);
  border-radius: 999px;
  padding: 18px 56px;
  cursor: pointer;
  box-shadow: 0 10px 0 var(--shadow), 0 14px 24px rgba(43, 92, 137, 0.25);
  transition: transform 0.18s ease, box-shadow 0.18s ease;
}

.btn:hover{
  transform: translateY(-3px) scale(1.03);
}

.btn:active{
  transform: translateY(3px);
  box-shadow: 0 6px 0 var(--shadow), 0 8px 16px rgba(43, 92, 137, 0.25);
}

.card{
  width: 100%;
  max-height: 100%;
  overflow-y: auto;
  background: var(--blue-soft);
  border: 4px solid var(--white);
  border-radius: 32px;
  box-shadow: 0 16px 0 var(--shadow), 0 22px 40px rgba(31, 78, 122, 0.3);
  padding: 36px 32px;
  text-align: center;
}

.members-card h1{
  margin: 0 0 22px 0;
  font-size: 1.8rem;
  color: var(--ink);
}

.members-card ul{
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.members-card li{
  font-size: 1.15rem;
  background: var(--white);
  border-radius: 999px;
  padding: 10px 20px;
  box-shadow: 0 4px 12px rgba(111, 179, 230, 0.35);
}

.video-card{
  padding: 16px;
  overflow: hidden;
  position: relative;
}

.video-card video{
  width: 100%;
  border-radius: 20px;
  display: block;
  background: #0b1f30;
}

.btn-skip{
  position: absolute;
  right: 26px;
  bottom: 26px;
  font-family: 'Fredoka', sans-serif;
  font-weight: 700;
  font-size: 0.95rem;
  color: var(--white);
  background: linear-gradient(160deg, var(--blue-deep), var(--blue));
  border: 2px solid var(--white);
  border-radius: 999px;
  padding: 8px 20px;
  cursor: pointer;
  box-shadow: 0 6px 0 var(--shadow), 0 8px 14px rgba(43, 92, 137, 0.3);
}

.btn-skip:active{
  transform: translateY(3px);
  box-shadow: 0 3px 0 var(--shadow), 0 5px 10px rgba(43, 92, 137, 0.3);
}

.kel-card img{
  width: 100%;
  height: auto;
  display: block;
  border-radius: 20px;
  object-fit: contain;
}

.end-card p{
  margin: 0;
  font-size: 1.6rem;
  color: var(--ink);
}

@keyframes enterFromTop{
  from{ transform: translateY(-160%); opacity: 0; }
  to{ transform: translateY(0); opacity: 1; }
}

@keyframes enterFromBottom{
  from{ transform: translateY(160%); opacity: 0; }
  to{ transform: translateY(0); opacity: 1; }
}

@keyframes exitUpward{
  from{ transform: translateY(0); opacity: 1; }
  to{ transform: translateY(-160%); opacity: 0; }
}

.anim-enter-top{
  animation: enterFromTop 0.5s ease-in forwards;
}

.anim-enter-bottom{
  animation: enterFromBottom 0.5s ease-in forwards;
}

.anim-exit-up{
  animation: exitUpward 0.5s ease-out forwards;
}

@media (prefers-reduced-motion: reduce){
  .anim-enter-top, .anim-enter-bottom, .anim-exit-up{
    animation-duration: 0.01s !important;
  }
}
</style>
</head>
<body>

<canvas id="snow"></canvas>

<div class="stage">

  <div id="view-start" class="view">
    <button id="btnStart" class="btn anim-enter-top">Start</button>
  </div>

  <div id="view-members" class="view hidden">
    <div class="card members-card">
      <h1>Kelompok 5</h1>
      <ul>
        <li>Federel</li>
        <li>Indah</li>
        <li>Danis</li>
        <li>Sarah</li>
        <li>Nazwa</li>
        <li>Fadila</li>
      </ul>
    </div>
    <button id="btnContinue" class="btn">Continue</button>
  </div>

  <div id="view-video" class="view hidden">
    <div class="card video-card">
      <video id="video1" src="video1.mp4" playsinline controls></video>
      <button id="btnSkip" class="btn-skip">Skip</button>
    </div>
  </div>

  <div id="view-kel" class="view hidden">
    <div class="card kel-card">
      <img src="kel.png" alt="Kelompok 5">
    </div>
    <button id="btnNext" class="btn">Next</button>
  </div>

  <div id="view-end" class="view hidden">
    <div class="card end-card">
      <p>Sekian Dari kelompok 5</p>
    </div>
  </div>

</div>

<script>
document.addEventListener('DOMContentLoaded', function(){
  try{

    const canvas = document.getElementById('snow');
    const ctx = canvas ? canvas.getContext('2d') : null;
    let particles = [];
    let width = 0;
    let height = 0;

    function resize(){
      if(!canvas) return;
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    function makeParticles(count){
      particles = [];
      for(let i = 0; i < count; i++){
        particles.push({
          x: Math.random() * width,
          y: Math.random() * height,
          r: Math.random() * 2 + 0.5,
          speedY: Math.random() * 0.6 + 0.2,
          speedX: Math.random() * 0.4 - 0.2,
          drift: Math.random() * Math.PI * 2,
          alpha: Math.random() * 0.45 + 0.25
        });
      }
    }
    makeParticles(160);

    function drawParticles(){
      if(ctx){
        ctx.clearRect(0, 0, width, height);
        ctx.fillStyle = '#8fc7ef';
        for(const p of particles){
          ctx.globalAlpha = p.alpha;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fill();
          p.y += p.speedY;
          p.drift += 0.01;
          p.x += p.speedX + Math.sin(p.drift) * 0.3;
          if(p.y > height + 5){
            p.y = -5;
            p.x = Math.random() * width;
          }
          if(p.x > width + 5) p.x = -5;
          if(p.x < -5) p.x = width + 5;
        }
        ctx.globalAlpha = 1;
      }
      requestAnimationFrame(drawParticles);
    }
    drawParticles();

    function exitThen(el, next){
      if(!el){
        next();
        return;
      }
      let done = false;
      function finish(){
        if(done) return;
        done = true;
        el.classList.add('hidden');
        el.classList.remove('anim-exit-up');
        next();
      }
      el.classList.remove('anim-enter-top', 'anim-enter-bottom');
      void el.offsetWidth;
      el.classList.add('anim-exit-up');
      el.addEventListener('animationend', finish, { once: true });
      setTimeout(finish, 550);
    }

    function enterView(el){
      if(!el) return;
      el.classList.remove('hidden');
      void el.offsetWidth;
      el.classList.add('anim-enter-bottom');
    }

    const viewStart = document.getElementById('view-start');
    const viewMembers = document.getElementById('view-members');
    const viewVideo = document.getElementById('view-video');
    const viewKel = document.getElementById('view-kel');
    const viewEnd = document.getElementById('view-end');
    const btnStart = document.getElementById('btnStart');
    const btnContinue = document.getElementById('btnContinue');
    const btnSkip = document.getElementById('btnSkip');
    const btnNext = document.getElementById('btnNext');
    const video1 = document.getElementById('video1');

    if(btnStart){
      btnStart.addEventListener('click', function(){
        exitThen(btnStart, function(){
          if(viewStart) viewStart.classList.add('hidden');
          enterView(viewMembers);
        });
      });
    }

    if(btnContinue){
      btnContinue.addEventListener('click', function(){
        if(video1){
          video1.muted = false;
          video1.volume = 1;
          const p = video1.play();
          if(p && typeof p.catch === 'function'){
            p.catch(function(){});
          }
        }
        exitThen(viewMembers, function(){
          enterView(viewVideo);
        });
      });
    }

    if(btnSkip){
      btnSkip.addEventListener('click', function(){
        btnSkip.disabled = true;
        if(video1){
          video1.pause();
        }
        exitThen(viewVideo, function(){
          enterView(viewKel);
        });
      });
    }

    if(btnNext){
      btnNext.addEventListener('click', function(){
        exitThen(viewKel, function(){
          enterView(viewEnd);
        });
      });
    }

    if(video1){
      video1.addEventListener('ended', function(){
        if(btnSkip) btnSkip.disabled = true;
        exitThen(viewVideo, function(){
          enterView(viewKel);
        });
      });
    }

  }catch(err){
    console.error('Terjadi kesalahan pada halaman:', err);
  }
});
</script>

</body>
</html>
